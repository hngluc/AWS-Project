name: AWS CDK Deploy (Production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout mã nguồn từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Thiết lập môi trường Node.js 20 và bật cache npm để tăng tốc build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 2.5: Thiết lập QEMU để giả lập container ARM64 trên máy ảo x86_64 của GitHub
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Đăng nhập vào tài khoản AWS bằng GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # Step 4: Cài đặt các thư viện phụ thuộc (node_modules)
      - name: Install Dependencies
        run: npm ci

      # Step 5: Biên dịch toàn bộ workspaces (Backend Lambdas & Frontend)
      - name: Build Project
        run: npm run build

      # Step 6: Deploy lên AWS Production thông qua CDK
      # Tự động nạp biến cấu hình Repo và Token từ Secrets để liên kết Amplify
      - name: Deploy CDK Stacks
        run: npm run --workspace=infrastructure deploy:production
        env:
          GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          GITHUB_REPO_URL: https://github.com/${{ github.repository }}

name: AWS CDK Deploy Pipeline

on:
  push:
    branches:
      - main

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Project
        run: npm run build

  deploy_staging:
    name: Deploy to Staging
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # TODO: Change to OIDC authentication in the future
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy CDK Stacks (Staging)
        run: npm run --workspace=infrastructure deploy:staging -- --require-approval never
        env:
          GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          GITHUB_REPO_URL: https://github.com/${{ github.repository }}
          DOCKER_BUILDKIT: 1

  deploy_production:
    name: Deploy to Production
    needs: deploy_staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: CDK Diff (Production)
        run: npm run --workspace=infrastructure cdk -- diff -c environment=production
        env:
          DOCKER_BUILDKIT: 1

      - name: Deploy CDK Stacks (Production)
        run: npm run --workspace=infrastructure deploy:production -- --require-approval never
        env:
          GITHUB_TOKEN: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
          GITHUB_BRANCH: main
          GITHUB_REPO_URL: https://github.com/${{ github.repository }}
          DOCKER_BUILDKIT: 1

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write   # OIDC for AWS
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: CDK Diff
        working-directory: infrastructure
        run: npx cdk diff --all -c environment=${{ github.event.inputs.environment || 'staging' }}

      - name: CDK Deploy
        working-directory: infrastructure
        run: npx cdk deploy --all --require-approval never -c environment=${{ github.event.inputs.environment || 'staging' }}

      - name: Output Stack Values
        working-directory: infrastructure
        run: |
          echo "### Deployment Outputs" >> $GITHUB_STEP_SUMMARY
          npx cdk list -c environment=${{ github.event.inputs.environment || 'staging' }} >> $GITHUB_STEP_SUMMARY
